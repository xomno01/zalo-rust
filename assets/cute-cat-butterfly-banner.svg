<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" shape-rendering="crispEdges">
  <style>
    @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes catBounce { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes tailWag { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    @keyframes legRunA { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(4px); } }
    @keyframes legRunB { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(-4px); } }
    @keyframes flutter { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
    @keyframes heartFloat { 0%, 100% { transform: translateY(0px); opacity: 0.7; } 50% { transform: translateY(-6px); opacity: 1; } }
    .s1 { animation: twinkle 1.8s steps(2, end) infinite; }
    .s2 { animation: twinkle 2.4s steps(2, end) 0.5s infinite; }
    .s3 { animation: twinkle 1.5s steps(2, end) 0.9s infinite; }
    .cat-hop { animation: catBounce 0.38s steps(2, end) infinite; }
    .tail { animation: tailWag 0.38s steps(2, end) infinite; }
    .leg-a { animation: legRunA 0.38s steps(2, end) infinite; }
    .leg-b { animation: legRunB 0.38s steps(2, end) infinite; }
    .wing { animation: flutter 0.24s steps(2, end) infinite; transform-box: fill-box; transform-origin: center; }
    .bfly-bob { animation: bob 0.9s ease-in-out infinite; }
    .bfly-bob2 { animation: bob 1.1s ease-in-out 0.3s infinite; }
    .heart { animation: heartFloat 1.4s steps(3, end) infinite; }
    .title { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; font-weight: 900; letter-spacing: 2px; }
    .mono { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <defs>
    <clipPath id="bannerClip">
      <rect x="4" y="4" width="872" height="252" rx="10" />
    </clipPath>
  </defs>

  <!-- Outer Rounded Frame -->
  <rect x="0" y="0" width="880" height="260" fill="#0b1324" rx="12" />
  <rect x="4" y="4" width="872" height="252" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10" />

  <g clip-path="url(#bannerClip)">
    <!-- Sky Layers -->
    <rect x="4" y="4" width="872" height="72" fill="#0f172a" />
    <rect x="4" y="76" width="872" height="58" fill="#132a4a" />
    <rect x="4" y="134" width="872" height="62" fill="#164e63" />

    <!-- Pixel Crescent Moon -->
    <g transform="translate(788, 24)">
      <rect x="8" y="0" width="20" height="4" fill="#fde047" />
      <rect x="4" y="4" width="24" height="4" fill="#fde047" />
      <rect x="0" y="8" width="20" height="16" fill="#facc15" />
      <rect x="4" y="24" width="24" height="4" fill="#fde047" />
      <rect x="8" y="28" width="20" height="4" fill="#fde047" />
    </g>

    <!-- Twinkling Pixel Stars -->
    <rect class="s1" x="48" y="26" width="4" height="4" fill="#fde047" />
    <rect class="s2" x="128" y="42" width="4" height="4" fill="#f472b6" />
    <rect class="s3" x="210" y="22" width="4" height="4" fill="#38bdf8" />
    <rect class="s1" x="342" y="32" width="4" height="4" fill="#a7f3d0" />
    <rect class="s2" x="478" y="20" width="4" height="4" fill="#fde047" />
    <rect class="s3" x="614" y="38" width="4" height="4" fill="#f472b6" />
    <rect class="s1" x="720" y="28" width="4" height="4" fill="#38bdf8" />
    <rect class="s2" x="836" y="68" width="4" height="4" fill="#fde047" />

    <!-- Drifting Fluffy Pixel Clouds -->
    <g opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="-120,0;920,0" dur="28s" repeatCount="indefinite" />
      <rect x="12" y="40" width="36" height="8" fill="#bae6fd" />
      <rect x="4" y="48" width="52" height="10" fill="#e0f2fe" />
    </g>
    <g opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="920,0;-140,0" dur="34s" repeatCount="indefinite" />
      <rect x="20" y="72" width="44" height="8" fill="#fbcfe8" />
      <rect x="10" y="80" width="64" height="10" fill="#fce7f3" />
    </g>

    <!-- Header Card Area -->
    <g transform="translate(36, 26)">
      <rect x="0" y="0" width="218" height="24" fill="#0b1324" stroke="#f472b6" stroke-width="2" />
      <rect x="8" y="8" width="8" height="8" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <text x="24" y="16" fill="#fbcfe8" font-size="11" class="mono">STANDALONE // WINDOWS &amp; MAC</text>

      <!-- Pixel Title -->
      <text x="2" y="68" fill="#0b1324" font-size="38" class="title">ZALO ULTRA NATIVE</text>
      <text x="0" y="65" fill="#fef08a" font-size="38" class="title">ZALO ULTRA NATIVE</text>

      <text x="0" y="92" fill="#e0f2fe" font-size="13" class="mono">Rust + Tauri v2  •  2.98 MB  •  Multi-Account WebView  •  Zero Zalo PC</text>

      <!-- Cute Pastel Feature Badges -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="118" height="24" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
        <text x="12" y="16" fill="#a7f3d0" font-size="11" class="mono">RUST NATIVE</text>

        <rect x="128" y="0" width="136" height="24" fill="#075985" stroke="#38bdf8" stroke-width="1.5" />
        <text x="140" y="16" fill="#bae6fd" font-size="11" class="mono">ISOLATED PROFILES</text>

        <rect x="274" y="0" width="126" height="24" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
        <text x="286" y="16" fill="#fbcfe8" font-size="11" class="mono">SYSTEM TRAY</text>

        <rect x="410" y="0" width="122" height="24" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
        <text x="422" y="16" fill="#fde68a" font-size="11" class="mono">WIN32 RAM TRIM</text>
      </g>
    </g>

    <!-- Pixel Meadow Ground -->
    <rect x="4" y="196" width="872" height="10" fill="#22c55e" />
    <rect x="4" y="206" width="872" height="16" fill="#16a34a" />
    <rect x="4" y="222" width="872" height="34" fill="#15803d" />

    <!-- Pixel Grass Tufts & Cute Flowers -->
    <g>
      <rect x="40" y="192" width="6" height="4" fill="#4ade80" />
      <rect x="74" y="200" width="6" height="6" fill="#16a34a" />
      <rect x="74" y="194" width="6" height="6" fill="#f472b6" />
      <rect x="76" y="196" width="2" height="2" fill="#fde047" />

      <rect x="190" y="202" width="4" height="8" fill="#15803d" />
      <rect x="188" y="196" width="8" height="6" fill="#fde047" />

      <rect x="330" y="192" width="8" height="4" fill="#4ade80" />
      <rect x="418" y="202" width="4" height="8" fill="#15803d" />
      <rect x="414" y="196" width="12" height="6" fill="#38bdf8" />
      <rect x="418" y="198" width="4" height="2" fill="#ffffff" />

      <rect x="572" y="202" width="4" height="8" fill="#15803d" />
      <rect x="568" y="196" width="12" height="6" fill="#fb7185" />
      <rect x="572" y="198" width="4" height="2" fill="#fef08a" />

      <rect x="710" y="192" width="8" height="4" fill="#4ade80" />
      <rect x="812" y="202" width="4" height="8" fill="#15803d" />
      <rect x="808" y="196" width="12" height="6" fill="#f472b6" />
      <rect x="812" y="198" width="4" height="2" fill="#fde047" />
    </g>

    <!-- ANIMATED SCENE: Pixel Cat chasing 2 Fluttering Butterflies across the screen! -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-160,0;960,0" dur="9.5s" repeatCount="indefinite" />

      <!-- Butterfly #1 (Pink & Gold, ahead of cat) -->
      <g transform="translate(132, 146)">
        <g class="bfly-bob">
          <g class="wing">
            <rect x="0" y="2" width="8" height="8" fill="#f472b6" />
            <rect x="2" y="4" width="4" height="4" fill="#fbcfe8" />
            <rect x="12" y="2" width="8" height="8" fill="#f472b6" />
            <rect x="14" y="4" width="4" height="4" fill="#fbcfe8" />
            <rect x="2" y="10" width="6" height="6" fill="#ec4899" />
            <rect x="12" y="10" width="6" height="6" fill="#ec4899" />
          </g>
          <rect x="8" y="4" width="4" height="10" fill="#1e293b" />
          <rect x="6" y="0" width="2" height="4" fill="#fde047" />
          <rect x="12" y="0" width="2" height="4" fill="#fde047" />
        </g>
      </g>

      <!-- Butterfly #2 (Cyan & Yellow, trailing higher) -->
      <g transform="translate(96, 128)">
        <g class="bfly-bob2">
          <g class="wing">
            <rect x="0" y="2" width="8" height="6" fill="#38bdf8" />
            <rect x="2" y="4" width="4" height="2" fill="#fef08a" />
            <rect x="10" y="2" width="8" height="6" fill="#38bdf8" />
            <rect x="12" y="4" width="4" height="2" fill="#fef08a" />
            <rect x="2" y="8" width="6" height="6" fill="#0ea5e9" />
            <rect x="10" y="8" width="6" height="6" fill="#0ea5e9" />
          </g>
          <rect x="8" y="3" width="2" height="10" fill="#0f172a" />
        </g>
      </g>

      <!-- Cute Floating Pixel Heart above Cat -->
      <g class="heart" transform="translate(46, 146)">
        <rect x="2" y="0" width="4" height="2" fill="#fb7185" />
        <rect x="8" y="0" width="4" height="2" fill="#fb7185" />
        <rect x="0" y="2" width="14" height="4" fill="#fb7185" />
        <rect x="2" y="6" width="10" height="2" fill="#f43f5e" />
        <rect x="4" y="8" width="6" height="2" fill="#f43f5e" />
        <rect x="6" y="10" width="2" height="2" fill="#f43f5e" />
      </g>

      <!-- Cute Orange Tabby Pixel Cat Running Right -->
      <g transform="translate(12, 166)">
        <!-- Ground Shadow -->
        <rect x="12" y="38" width="40" height="4" fill="#14532d" opacity="0.6" />

        <g class="cat-hop">
          <!-- Wagging Tail -->
          <g class="tail">
            <rect x="0" y="10" width="6" height="6" fill="#fb923c" />
            <rect x="4" y="14" width="6" height="6" fill="#f97316" />
            <rect x="8" y="18" width="6" height="6" fill="#ea580c" />
          </g>

          <!-- Cat Body -->
          <rect x="12" y="18" width="32" height="16" fill="#fb923c" />
          <rect x="16" y="20" width="24" height="12" fill="#fdba74" />
          <!-- Cute Tabby Stripes -->
          <rect x="20" y="18" width="4" height="6" fill="#ea580c" />
          <rect x="28" y="18" width="4" height="6" fill="#ea580c" />
          <!-- White Belly -->
          <rect x="18" y="30" width="20" height="4" fill="#fff7ed" />

          <!-- Cat Head -->
          <rect x="34" y="4" width="26" height="22" fill="#fb923c" />
          <!-- Pointy Ears -->
          <rect x="34" y="0" width="6" height="6" fill="#f97316" />
          <rect x="36" y="2" width="2" height="4" fill="#f9a8d4" />
          <rect x="52" y="0" width="6" height="6" fill="#f97316" />
          <rect x="54" y="2" width="2" height="4" fill="#f9a8d4" />
          <!-- Forehead Stripe -->
          <rect x="44" y="4" width="4" height="6" fill="#ea580c" />
          <!-- Cute Cheeks -->
          <rect x="38" y="18" width="22" height="8" fill="#fff7ed" />
          <!-- Eyes & White Sparkle -->
          <rect x="42" y="12" width="4" height="4" fill="#0f172a" />
          <rect x="42" y="12" width="2" height="2" fill="#ffffff" />
          <rect x="54" y="12" width="4" height="4" fill="#0f172a" />
          <rect x="54" y="12" width="2" height="2" fill="#ffffff" />
          <!-- Pink Nose & Smile -->
          <rect x="50" y="16" width="4" height="3" fill="#f472b6" />
          <rect x="38" y="17" width="4" height="2" fill="#fbcfe8" />
          <!-- Whiskers -->
          <rect x="60" y="16" width="6" height="2" fill="#fde68a" />
          <rect x="60" y="20" width="5" height="2" fill="#fde68a" />

          <!-- Running Paws -->
          <g class="leg-a">
            <rect x="14" y="32" width="6" height="6" fill="#f97316" />
            <rect x="14" y="36" width="6" height="2" fill="#fff7ed" />
            <rect x="38" y="32" width="6" height="6" fill="#f97316" />
            <rect x="38" y="36" width="6" height="2" fill="#fff7ed" />
          </g>
          <g class="leg-b">
            <rect x="22" y="32" width="6" height="6" fill="#ea580c" />
            <rect x="22" y="36" width="6" height="2" fill="#fff7ed" />
            <rect x="46" y="30" width="6" height="6" fill="#fb923c" />
            <rect x="48" y="34" width="6" height="2" fill="#fff7ed" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
