<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Trình quản lý tài khoản Zalo độc lập dùng WebView gốc của hệ điều hành, hỗ trợ tách phiên và nén RAM." />
  <title>Zalo Ultra Native</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-group">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
          </svg>
        </span>
        <h1 class="app-title">Zalo Ultra Native</h1>
      </div>

      <div class="top-actions">
        <span id="ram-pill" class="ram-pill" title="Bộ nhớ đang dùng">-- MB</span>

        <button id="trim-ram-btn" type="button" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <span>Nén RAM</span>
        </button>

        <button id="toggle-add-btn" type="button" class="btn btn-primary" aria-expanded="false" aria-controls="add-account-form">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>Thêm tài khoản</span>
        </button>
      </div>
    </header>

    <div id="error-banner" class="error-banner" role="alert" hidden>
      <span id="error-message" class="error-text"></span>
      <button id="error-dismiss" type="button" class="icon-dismiss" aria-label="Đóng thông báo lỗi">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <form id="add-account-form" class="add-form" hidden>
      <div class="add-form-fields">
        <label class="field-label" for="account-name-input">Tên tài khoản</label>
        <input
          id="account-name-input"
          class="text-input"
          type="text"
          maxlength="48"
          placeholder="Ví dụ: Công việc, Cá nhân, Shop…"
          required
          autocomplete="off"
        />
      </div>

      <div class="add-form-footer">
        <label class="checkbox-label" for="account-auto-open">
          <input id="account-auto-open" type="checkbox" />
          <span>Tự động mở khi khởi động</span>
        </label>

        <div class="add-form-buttons">
          <button id="cancel-add-btn" type="button" class="btn btn-ghost">Hủy</button>
          <button id="submit-add-btn" type="submit" class="btn btn-primary">Tạo tài khoản</button>
        </div>
      </div>
    </form>

    <main class="main-panel">
      <div class="section-header">
        <h2 class="section-title">Danh sách tài khoản</h2>
        <span id="window-count" class="section-meta">0 cửa sổ đang chạy</span>
      </div>

      <div id="profiles-list" class="profiles-list" role="list">
        <div class="empty-state">Đang tải danh sách tài khoản…</div>
      </div>
    </main>

    <footer class="app-footer">
      <p class="footer-note">
        Mỗi tài khoản lưu cookie và phiên đăng nhập tách biệt theo hệ điều hành (WebView2 trên Windows, WKWebView trên macOS), không phụ thuộc Zalo PC.
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
